groups:
  - name: devsecops_alerts
    interval: 30s
    rules:
      # Application Health Alerts
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: AppDown
        expr: up{job="devsecops-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "Application has been unavailable for more than 1 minute"

      # Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile response time is {{ $value }}s"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is at {{ $value | humanizePercentage }}"

      # Security Alerts
      - alert: VulnerabilityDetected
        expr: security_vulnerabilities_total > 0
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Security vulnerabilities detected"
          description: "{{ $value }} vulnerabilities found in latest scan"

      - alert: SecretExposure
        expr: secrets_detected_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Secret exposure detected"
          description: "{{ $value }} secrets were found in repository scan"

      # Build Alerts
      - alert: BuildFailed
        expr: ci_pipeline_status{status="failed"} > 0
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "CI/CD pipeline failed"
          description: "Build pipeline failed for commit {{ $labels.commit }}"

      - alert: TestFailure
        expr: ci_test_failures_total > 0
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Test failures detected"
          description: "{{ $value }} tests failed in latest build"

      # Container Alerts
      - alert: UnpatchedVulnerability
        expr: container_vulnerabilities_critical > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Critical container vulnerability"
          description: "{{ $value }} critical vulnerabilities in container image"

      # Compliance Alerts
      - alert: ComplianceViolation
        expr: compliance_violations_total > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Compliance violation detected"
          description: "{{ $value }} compliance violations detected"
