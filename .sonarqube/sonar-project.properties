# SonarQube Project Configuration
sonar.projectKey=msi-devsecops
sonar.projectName=MSI DevSecOps Pipeline
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,node_modules/**,dist/**

# Test configuration
sonar.tests=test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage settings
sonar.typescript.exclusions=**/*.spec.ts

# Code quality gates
sonar.qualitygate.wait=true

# Security hotspot settings
sonar.security.hotspots.review.rating.threshold=HIGH
